<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureID IAM Authentication</title>
  <meta name="description" content="SecureID enterprise identity and access management authentication portal.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-3 sm:p-4 md:p-6 font-sans text-[#111827] antialiased">

  <!-- Main Responsive Authentication Container -->
  <main class="w-full max-w-[880px] min-h-[580px] bg-white rounded-xl md:rounded-2xl border border-[#D9DDE5] auth-shadow overflow-hidden flex flex-col md:flex-row relative">
    
    <!-- Left Branded Panel (Visible on Desktop >= 768px) -->
    <section class="hidden md:flex md:w-[35%] bg-[#2445D8] relative flex-col items-center justify-center p-8 text-center text-white overflow-hidden shrink-0 select-none">
      <!-- Subtle Decorative Background Overlay Shapes -->
      <div class="absolute inset-0 pointer-events-none opacity-20">
        <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full border-[28px] border-white/20"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full border-[24px] border-white/20"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full bg-white/5 blur-2xl"></div>
      </div>

      <!-- Shield Icon & Brand Logo -->
      <div class="relative z-10 w-16 h-16 mb-4 flex items-center justify-center">
        <svg class="w-16 h-16 text-white drop-shadow-xs" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <svg class="w-7 h-7 text-[#2445D8] absolute top-[18px]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>

      <!-- Brand Heading & Tagline -->
      <h1 class="relative z-10 text-[24px] font-bold tracking-tight text-white mb-2">
        SecureID
      </h1>
      <p class="relative z-10 text-[13px] text-blue-100/90 font-normal leading-relaxed max-w-[200px]">
        Secure access to your account
      </p>
    </section>

    <!-- Right Authentication Panel (Dynamic View Content) -->
    <section class="w-full md:w-[65%] bg-white flex flex-col justify-between p-6 sm:p-8 md:p-10">
      
      <!-- Dynamic View Container (Login / Choose Method / OTP views) -->
      <div id="authCardContent" class="w-full max-w-[400px] mx-auto my-auto py-2">
        <!-- Rendered by JS State Engine -->
      </div>

      <!-- Enterprise Footer (Web) -->
      <footer class="mt-4 pt-2 text-center text-[11px] text-[#6B7280] font-normal select-none">
        © 2026 SecureID. All rights reserved.
      </footer>
    </section>

  </main>

  <!-- Application Modular JavaScript Entry -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
