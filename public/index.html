<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureID - Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4 md:p-6 font-sans text-slate-800 antialiased">

  <!-- Authentication Card -->
  <main class="w-full max-w-[880px] min-h-[620px] bg-white rounded-2xl border border-slate-200/80 shadow-[0_12px_32px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col md:flex-row">
    
    <!-- Left Branding Panel -->
    <section class="w-full md:w-[34%] bg-gradient-to-br from-[#4579F5] via-[#3B72E9] to-[#2555D6] relative flex flex-col items-center justify-center p-8 text-center text-white overflow-hidden shrink-0">
      
      <!-- Subtle Background Shapes/Pattern -->
      <div class="absolute inset-0 pointer-events-none opacity-15">
        <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full border-[30px] border-white/20"></div>
        <div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full border-[20px] border-white/20"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.15)_0%,transparent_70%)]"></div>
      </div>

      <!-- Shield & Lock Icon -->
      <div class="relative z-10 w-16 h-16 mb-5 flex items-center justify-center">
        <!-- White Shield -->
        <svg class="w-16 h-16 text-white drop-shadow-xs" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <!-- Blue Padlock inside Shield -->
        <svg class="w-7 h-7 text-[#2555D6] absolute top-[18px]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>

      <!-- Brand Title -->
      <h1 class="relative z-10 text-[26px] font-bold tracking-tight text-white mb-3">
        SecureID
      </h1>

      <!-- Tagline -->
      <p class="relative z-10 text-[14px] text-blue-100/90 font-normal leading-snug">
        Secure access<br>for everyone.
      </p>

    </section>

    <!-- Right Login Panel -->
    <section class="w-full md:w-[66%] bg-white flex flex-col justify-between p-8 sm:p-10 md:p-12">
      
      <!-- Center Container -->
      <div class="w-full max-w-[360px] mx-auto my-auto flex flex-col justify-center">
        
        <!-- Header -->
        <div class="text-center mb-7">
          <h2 class="text-[24px] sm:text-[26px] font-bold text-slate-900 tracking-tight mb-1">
            Welcome back!
          </h2>
          <p class="text-[13.5px] text-slate-500 font-normal">
            Login to your account
          </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-3.5" onsubmit="event.preventDefault();">
          
          <!-- Email Field -->
          <div>
            <div id="emailWrapper" class="relative flex items-center h-[46px] rounded-lg border border-slate-200 bg-white px-3.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-colors">
              <!-- User Icon -->
              <svg class="w-4 h-4 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>

              <!-- Email Input -->
              <input 
                type="email" 
                id="emailInput" 
                class="w-full bg-transparent text-slate-900 text-[14px] outline-none placeholder-slate-400 font-normal" 
                placeholder="Email address"
                required
              />
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div id="passwordWrapper" class="relative flex items-center h-[46px] rounded-lg border border-slate-200 bg-white px-3.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-colors">
              <!-- Lock Icon -->
              <svg class="w-4 h-4 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>

              <!-- Password Input -->
              <input 
                type="password" 
                id="passwordInput"  
                class="w-full bg-transparent text-slate-900 text-[14px] outline-none tracking-widest font-bold placeholder-slate-400" 
                placeholder="Password"
                required
              />

              <!-- Eye Icon -->
              <button 
                type="button" 
                id="togglePassword" 
                aria-label="Toggle password visibility"
                class="ml-2 shrink-0 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer"
              >
                <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember me & Forgot password Row -->
          <div class="flex items-center justify-between text-[13.5px] pt-1">
            <label class="flex items-center cursor-pointer select-none">
              <input 
                type="checkbox" 
                class="w-[18px] h-[18px] rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer accent-[#2563EB]"
              />
              <span class="ml-2 text-slate-600 font-normal">Remember me</span>
            </label>
            <a href="#" class="text-[#2563EB] hover:text-blue-700 font-medium hover:underline transition-colors">
              Forgot password?
            </a>
          </div>

          <!-- Primary Login Button -->
          <div class="pt-2">
            <button 
              type="submit" 
              class="w-full h-[46px] bg-[#2563EB] hover:bg-[#1D4ED8] active:bg-[#1E40AF] text-white text-[15px] font-semibold rounded-lg shadow-xs transition-colors cursor-pointer"
            >
              Login
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="my-5 text-center">
          <span class="text-[13px] text-slate-400 font-normal">or</span>
        </div>

        <!-- Continue with Google Button (Disabled) -->
        <button 
          type="button" 
          disabled
          class="w-full h-[46px] bg-slate-50 border border-slate-200 text-slate-400 text-[14px] font-medium rounded-lg flex items-center justify-center gap-3 cursor-not-allowed opacity-60"
        >
          <!-- Authentic Google G Logo (Grayscaled / muted when disabled) -->
          <svg class="w-4 h-4 shrink-0 opacity-50" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <!-- Registration Link -->
        <div class="mt-6 text-center text-[13.5px] text-slate-500">
          <span>New here? </span>
          <a href="#" class="text-[#2563EB] font-medium hover:underline transition-colors">Create an account</a>
        </div>

      </div>

      <!-- Footer -->
      <footer class="mt-6 text-center text-[11.5px] text-slate-400 font-normal">
        © 2025 SecureID. All rights reserved.
      </footer>

    </section>

  </main>

  <!-- Toggle Password Interactive Script -->
  <script>
    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePassword');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });
  </script>
</body>
</html>
