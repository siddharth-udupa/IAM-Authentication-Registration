<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureID - Sign Up</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4 md:p-6 font-sans text-slate-800 antialiased">

  <!-- Authentication Card -->
  <main class="w-full max-w-[880px] min-h-[620px] bg-white rounded-2xl border border-slate-200/80 shadow-[0_12px_32px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col md:flex-row relative">
    
    <!-- Left Branding Panel -->
    <section class="w-full md:w-[34%] bg-gradient-to-br from-[#4579F5] via-[#3B72E9] to-[#2555D6] relative flex flex-col items-center justify-center p-8 text-center text-white overflow-hidden shrink-0">
      <div class="absolute inset-0 pointer-events-none opacity-15">
        <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full border-[30px] border-white/20"></div>
        <div class="absolute -bottom-20 -right-20 w-80 h-80 rounded-full border-[20px] border-white/20"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.15)_0%,transparent_70%)]"></div>
      </div>

      <div class="relative z-10 w-16 h-16 mb-5 flex items-center justify-center">
        <svg class="w-16 h-16 text-white drop-shadow-xs" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <svg class="w-7 h-7 text-[#2555D6] absolute top-[18px]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>

      <h1 class="relative z-10 text-[26px] font-bold tracking-tight text-white mb-3">
        SecureID
      </h1>
      <p class="relative z-10 text-[14px] text-blue-100/90 font-normal leading-snug">
        Create your account<br>in seconds.
      </p>
    </section>

    <!-- Right Signup Panel -->
    <section class="w-full md:w-[66%] bg-white flex flex-col justify-between p-8 sm:p-10 md:p-12">
      <div class="w-full max-w-[380px] mx-auto my-auto flex flex-col justify-center">
        
        <!-- Header -->
        <div class="text-center mb-5">
          <h2 class="text-[24px] sm:text-[26px] font-bold text-slate-900 tracking-tight mb-1">
            Create an Account
          </h2>
          <p class="text-[13.5px] text-slate-500 font-normal">
            Enter your details to register
          </p>
        </div>

        <!-- Notification Alert Container -->
        <div id="alertContainer" class="hidden mb-4"></div>

        <!-- Registration Form -->
        <form id="signupForm" class="space-y-3" novalidate>
          <!-- Email Field -->
          <div>
            <div class="relative flex items-center h-[44px] rounded-lg border border-slate-200 bg-white px-3.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-colors">
              <svg class="w-4 h-4 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
              <input 
                type="email" 
                id="emailInput" 
                class="w-full bg-transparent text-slate-900 text-[14px] outline-none placeholder-slate-400 font-normal" 
                placeholder="Email address"
                required
              />
            </div>
          </div>

          <!-- Phone Field (Optional) -->
          <div>
            <div class="relative flex items-center h-[44px] rounded-lg border border-slate-200 bg-white px-3.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-colors">
              <svg class="w-4 h-4 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <input 
                type="tel" 
                id="phoneInput" 
                class="w-full bg-transparent text-slate-900 text-[14px] outline-none placeholder-slate-400 font-normal" 
                placeholder="Phone number (optional)"
              />
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div class="relative flex items-center h-[44px] rounded-lg border border-slate-200 bg-white px-3.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-colors">
              <svg class="w-4 h-4 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              <input 
                type="password" 
                id="passwordInput"  
                class="w-full bg-transparent text-slate-900 text-[14px] outline-none tracking-widest font-bold placeholder-slate-400" 
                placeholder="Password"
                required
              />
              <button 
                type="button" 
                id="togglePassword" 
                aria-label="Toggle password visibility"
                class="ml-2 shrink-0 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer"
              >
                <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div>
            <div class="relative flex items-center h-[44px] rounded-lg border border-slate-200 bg-white px-3.5 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-colors">
              <svg class="w-4 h-4 text-slate-400 mr-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <input 
                type="password" 
                id="confirmPasswordInput"  
                class="w-full bg-transparent text-slate-900 text-[14px] outline-none tracking-widest font-bold placeholder-slate-400" 
                placeholder="Confirm password"
                required
              />
            </div>
          </div>

          <!-- MFA Enable Toggle Checkbox -->
          <div class="flex items-center text-[13px] pt-1">
            <label class="flex items-center cursor-pointer select-none">
              <input 
                type="checkbox" 
                id="mfaCheckbox"
                class="w-[18px] h-[18px] rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer accent-[#2563EB]"
              />
              <span class="ml-2 text-slate-700 font-medium">Enable Two-Factor Authentication (MFA)</span>
            </label>
          </div>

          <!-- Primary Submit Button -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="submitBtn"
              class="w-full h-[46px] bg-[#2563EB] hover:bg-[#1D4ED8] active:bg-[#1E40AF] text-white text-[15px] font-semibold rounded-lg shadow-xs transition-colors cursor-pointer flex items-center justify-center"
            >
              <span>Sign Up</span>
            </button>
          </div>
        </form>

        <!-- Login Link -->
        <div class="mt-6 text-center text-[13.5px] text-slate-500">
          <span>Already have an account? </span>
          <a href="/index.html" class="text-[#2563EB] font-medium hover:underline transition-colors">Sign in</a>
        </div>

      </div>

      <footer class="mt-6 text-center text-[11.5px] text-slate-400 font-normal">
        © 2026 SecureID. All rights reserved.
      </footer>
    </section>

  </main>

  <script type="module" src="/js/signup.js"></script>
</body>
</html>
